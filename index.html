<!DOCTYPE html>
<!-- Hearth Log build v2 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RCS-1 Ops</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RCS-1 Ops">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="rcs1-manifest.json">
<link rel="icon" href="rcs1-icon-192.png">
<link rel="apple-touch-icon" href="rcs1-icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

:root{
  --bg:#0f0b07;
  --bg-2:#171009;
  --surface:#161009;
  --surface-2:#20160d;
  --ink:#f2e8d6;
  --ink-soft:#c2ac89;
  --amber:#e0a24a;
  --amber-deep:#b87d28;
  --sage:#7a9a68;
  --rust:#d1614a;
  --line:#4a3a26;
  --line-soft:rgba(224,162,74,0.22);
  --font-display:'Fraunces', serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}

*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}
a{color:inherit;}

#app{display:flex;min-height:100vh;}

.sidebar{
  width:220px;flex-shrink:0;background:var(--bg-2);border-right:1px solid var(--line-soft);
  padding:28px 0;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;
}
.brand{font-family:var(--font-display);font-size:1.5rem;font-weight:600;padding:0 24px 20px;letter-spacing:0.02em;color:#e8dcc4;}
.brand span{color:var(--amber);}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:12px 24px;color:#cbb99e;font-size:0.95rem;
  border-left:3px solid transparent;transition:all .15s ease;background:none;border-top:none;border-right:none;border-bottom:none;text-align:left;width:100%;
}
.nav-item:hover{background:rgba(201,133,47,0.08);color:var(--surface);}
.nav-item.active{color:var(--amber);border-left-color:var(--amber);background:rgba(201,133,47,0.1);font-weight:600;}
.nav-icon{font-size:1.1rem;width:20px;text-align:center;}
.sidebar-foot{margin-top:auto;padding:16px 24px 0;font-size:0.75rem;color:#7a6b57;}

main{flex:1;background:var(--surface);color:var(--ink);min-height:100vh;padding:36px 40px 80px;overflow-x:hidden;}
.page-title{font-family:var(--font-display);font-size:2rem;font-weight:600;margin:0 0 6px;}
.page-sub{color:var(--ink-soft);margin:0 0 28px;font-size:0.95rem;}

.card{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:10px;padding:24px;margin-bottom:20px;}
.card h3{font-family:var(--font-display);font-size:1.3rem;margin:0 0 12px;font-weight:600;}
.eyebrow{font-family:var(--font-mono);font-size:0.72rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--amber-deep);margin:0 0 6px;font-weight:600;}

.btn{display:inline-flex;align-items:center;gap:8px;background:var(--amber);color:#2a1c0e;border:none;padding:11px 20px;border-radius:7px;font-weight:600;font-size:0.9rem;transition:transform .1s ease, background .15s ease;}
.btn:hover{background:var(--amber-deep);color:#fff;}
.btn:focus-visible, .nav-item:focus-visible, select:focus-visible, input:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
.btn.ghost:hover{background:rgba(138,106,60,0.1);}
.btn.small{padding:7px 14px;font-size:0.8rem;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}

.week-ribbon{display:flex;gap:4px;margin:18px 0 8px;flex-wrap:wrap;}
.week-seg{flex:1;min-width:24px;height:34px;border-radius:5px;background:#2c2013;position:relative;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:0.7rem;color:var(--ink-soft);border:1px solid var(--line-soft);}
.week-seg.past{background:var(--amber-deep);color:#fff2df;border-color:var(--amber-deep);}
.week-seg.current{background:var(--amber);color:#2a1c0e;border-color:var(--amber-deep);font-weight:700;box-shadow:0 0 0 2px rgba(201,133,47,0.3);}
.week-seg.current::after{content:"🔥";position:absolute;top:-16px;font-size:0.9rem;}

.banner{border-radius:10px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:flex-start;gap:12px;font-size:0.92rem;}
.banner.alert{background:rgba(177,71,47,0.12);border:1px solid rgba(177,71,47,0.4);}
.banner.info{background:rgba(201,133,47,0.12);border:1px solid rgba(201,133,47,0.4);}
.banner.done{background:rgba(111,138,92,0.15);border:1px solid rgba(111,138,92,0.4);}
.banner.error{background:rgba(177,71,47,0.18);border:1px solid var(--rust);}
.banner b{display:block;margin-bottom:2px;font-family:var(--font-display);font-size:1.05rem;}

.grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;}

ol.steps{padding-left:20px;margin:8px 0;}
ol.steps li{margin-bottom:8px;line-height:1.5;font-size:0.93rem;}
ul.plain{padding-left:20px;margin:8px 0;}
ul.plain li{margin-bottom:6px;line-height:1.5;font-size:0.93rem;}

.tag{display:inline-block;background:rgba(138,106,60,0.15);border:1px solid var(--line-soft);padding:2px 10px;border-radius:20px;font-size:0.75rem;color:var(--ink-soft);margin-right:6px;}

table.grocery{width:100%;border-collapse:collapse;font-size:0.88rem;margin-top:10px;}
table.grocery th{text-align:left;font-family:var(--font-mono);font-size:0.7rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);border-bottom:1px solid var(--line-soft);padding:6px 8px;}
table.grocery td{padding:6px 8px;border-bottom:1px solid var(--line-soft);}
table.grocery tr:last-child td{font-weight:700;border-bottom:none;padding-top:10px;}

.plan-card{border:1px solid var(--line-soft);border-radius:10px;background:var(--surface-2);margin-bottom:16px;overflow:hidden;}
.plan-head{padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
.plan-head h3{margin:0;font-family:var(--font-display);font-size:1.25rem;}
.plan-head p{margin:4px 0 0;color:var(--ink-soft);font-size:0.88rem;}
.plan-body{padding:0 22px 22px;display:none;border-top:1px solid var(--line-soft);}
.plan-body.open{display:block;padding-top:16px;}
.recipe-block{margin-bottom:18px;}
.recipe-block h4{font-family:var(--font-display);font-size:1.05rem;margin:0 0 4px;}

.chore-table{width:100%;border-collapse:collapse;margin-top:8px;}
.chore-table td, .chore-table th{padding:10px 12px;border-bottom:1px solid var(--line-soft);font-size:0.88rem;vertical-align:top;}
.chore-table th{font-family:var(--font-mono);font-size:0.7rem;text-transform:uppercase;color:var(--ink-soft);text-align:left;}
.chore-table tr.today{background:rgba(201,133,47,0.15);}
.chore-table tr.today td:first-child{font-weight:700;color:var(--amber-deep);}

.payday-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px;}
.payday-pill{border:1px solid var(--line-soft);border-radius:8px;padding:10px 12px;font-family:var(--font-mono);font-size:0.82rem;text-align:center;}
.payday-pill.next{background:var(--amber);color:#2a1c0e;border-color:var(--amber-deep);font-weight:700;}
.payday-pill.past{opacity:0.45;}

.field-row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin:14px 0;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:0.78rem;color:var(--ink-soft);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.04em;}
.field input, .field select{padding:9px 12px;border-radius:6px;border:1px solid var(--line);background:#241a11;color:var(--ink);font-size:0.9rem;}

.empty-state{text-align:center;padding:60px 20px;}
.empty-state .glyph{font-size:2.5rem;margin-bottom:12px;}
.empty-state h3{font-family:var(--font-display);font-size:1.4rem;margin:0 0 8px;}
.empty-state p{color:var(--ink-soft);max-width:420px;margin:0 auto 20px;}

/* Calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.cal-head h3{font-family:var(--font-display);font-size:1.4rem;margin:0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;width:100%;}
.cal-dow{font-family:var(--font-mono);font-size:0.68rem;text-transform:uppercase;color:var(--ink-soft);text-align:center;padding-bottom:4px;}
.cal-cell{border:1px solid var(--line-soft);border-radius:8px;min-height:104px;min-width:0;padding:6px 7px;font-size:0.75rem;background:var(--surface-2);display:flex;flex-direction:column;gap:3px;}
.cal-cell.empty{background:transparent;border-color:transparent;}
.cal-cell.today{border-color:var(--amber);border-width:2px;}
.cal-cell.selected{background:rgba(224,162,74,0.15);}
.cal-cell-top{display:flex;justify-content:space-between;align-items:center;gap:6px;}
.cal-daynum{font-family:var(--font-mono);font-weight:700;font-size:0.8rem;}
.cal-chore{color:var(--ink-soft);font-size:0.68rem;line-height:1.3;}
.cal-icons{display:flex;gap:3px;font-size:0.75rem;flex-shrink:0;}
.cal-toggle{margin-top:auto;font-size:0.65rem;padding:4px 6px;border-radius:5px;border:1px solid var(--line-soft);background:transparent;color:var(--ink-soft);width:100%;}
.cal-detail{margin-top:10px;padding-top:12px;border-top:1px solid var(--line-soft);}
.cal-detail .recipe-block{margin-bottom:14px;}
.cal-detail .recipe-block:last-of-type{margin-bottom:12px;}
.cal-toggle.done{background:var(--sage);color:#fff;border-color:var(--sage);}
.shift-row{display:flex;gap:6px;flex-wrap:wrap;}
.shift-hour{flex:1;min-width:52px;padding:10px 4px;border-radius:7px;border:1px solid var(--line-soft);background:transparent;color:var(--ink-soft);font-family:var(--font-mono);font-size:0.78rem;font-weight:600;}
.shift-hour.done{background:var(--sage);color:#fff;border-color:var(--sage);}
.status-btn{flex:1;min-width:100px;padding:10px 8px;border-radius:7px;border:1px solid var(--line-soft);background:transparent;color:var(--ink-soft);font-family:var(--font-mono);font-size:0.78rem;font-weight:600;}
.status-btn:hover{border-color:var(--amber);}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:0.8rem;color:var(--ink-soft);}

@media (max-width: 820px){
  #app{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:sticky;top:0;flex-direction:row;overflow-x:auto;padding:10px 8px;z-index:10;border-right:none;border-bottom:1px solid var(--line-soft);}
  .brand{display:none;}
  .nav-item{flex-direction:column;gap:4px;padding:8px 14px;font-size:0.72rem;border-left:none;border-bottom:3px solid transparent;white-space:nowrap;}
  .nav-item.active{border-left-color:transparent;border-bottom-color:var(--amber);}
  .sidebar-foot{display:none;}
  main{padding:24px 18px 60px;}
  .grid-2{grid-template-columns:1fr;}
  .page-title{font-size:1.6rem;}
  .cal-grid{display:flex;flex-direction:column;gap:8px;}
  .cal-dow{display:none;}
  .cal-cell.empty{display:none;}
  .cal-cell{min-height:auto;padding:12px 14px;font-size:0.85rem;border-radius:10px;}
  .cal-daynum{font-size:0.95rem;}
  .cal-chore{font-size:0.8rem;}
  .cal-toggle{width:auto;align-self:flex-start;padding:6px 12px;font-size:0.75rem;margin-top:6px;}
}

::selection{background:var(--amber);color:#2a1c0e;}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;} }

/* ===== RCS-1 SHIP OPS THEME ===== */
:root{--bg:#0b0d10;--bg-2:#0f1216;--surface:#12161b;--surface-2:#181d23;--ink:#dde5ea;--ink-soft:#8d9ba6;--amber:#e0a24a;--amber-deep:#e0a24a;--sage:#4fd1a5;--rust:#e5533d;--line:#2b333c;--line-soft:rgba(224,162,74,.3);--cyan:#4fc3d9;--font-display:'Share Tech Mono','IBM Plex Mono',monospace;--font-body:'IBM Plex Mono',monospace;--font-mono:'Share Tech Mono','IBM Plex Mono',monospace;}
body{background:var(--bg);font-size:14px;}
.page-title,.card h3,.brand{text-transform:uppercase;letter-spacing:.12em;}
.page-title{color:var(--amber);font-size:1.5rem;}
.card{border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:0 16px 0 0;background:var(--surface);}
.eyebrow{color:var(--cyan);}
.btn,.status-btn,.shift-hour{border-radius:2px;text-transform:uppercase;letter-spacing:.06em;}
.week-seg{background:#1a2027;}
.banner{border-radius:2px;}
.nav-item.active{color:var(--amber);}
.meter{height:22px;background:#06080a;border:1px solid var(--line);overflow:hidden;}
.meter-fill{height:100%;transition:width .4s;background-image:repeating-linear-gradient(90deg,transparent 0 12px,rgba(0,0,0,.45) 12px 14px);}
.lvl-ok{background-color:var(--sage);}.lvl-mid{background-color:var(--amber);}.lvl-low{background-color:var(--rust);}
.mtext{font-family:var(--font-mono);margin-top:8px;font-size:.95rem;letter-spacing:.05em;}
.ok{color:var(--sage);}.warn{color:var(--amber);}.crit{color:var(--rust);}
.next{border:1px dashed var(--amber);padding:10px;margin-top:12px;color:var(--amber);font-family:var(--font-mono);}
.proto{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);}
.proto .tx{font-family:var(--font-mono);font-size:.85rem;}
#shiftClock{font-family:var(--font-mono);font-size:1.3rem;color:var(--cyan);margin:8px 0 12px;}
.overlay{position:fixed;inset:0;z-index:999;background:rgba(5,6,8,.96);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--amber);font-family:var(--font-mono);font-size:1.25rem;letter-spacing:.12em;padding:24px;animation:ovl 2.2s forwards;pointer-events:none;}
@keyframes ovl{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}
</style>
</head>

<script>

/* ============================= STORAGE (with standalone fallback) ============================= */
// If this file is opened directly in a phone/desktop browser (not inside Claude),
// window.storage won't exist — fall back to the browser's own localStorage instead.
// That means: download this file, open it in your phone's browser, add to home screen,
// and it saves permanently on that phone, no Claude account or paid plan required.
const storage = (function(){
  if (window.storage) return window.storage;
  return {
    async get(key){
      const raw = localStorage.getItem('hearth_'+key);
      if(raw===null) throw new Error('not found');
      return {key, value: raw};
    },
    async set(key, value){
      localStorage.setItem('hearth_'+key, value);
      return {key, value};
    }
  };
})();
const usingLocalFallback = !window.storage;
// Everything lives in ONE object, saved as ONE storage key — fewer calls, more reliable.
let state = { active:null, choreLog:{}, activityLog:{}, shiftLog:{}, tab:"today" };
let selectedCalDate = null;
let openPlanId = null;

let saveError = null;
let scrollToTodayFlag = false; // set true when jumping to Calendar tab so we auto-scroll to today's cell

// Local-calendar-day date string (YYYY-MM-DD) — deliberately NOT toISOString(),
// which converts to UTC and can silently roll the date over an hour or more
// early/late depending on timezone, right around midnight.
function toLocalISO(d){
  const year = d.getFullYear();
  const month = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${year}-${month}-${day}`;
}
function todayISO(){ return toLocalISO(new Date()); }
function fmtDate(iso){ const d=new Date(iso+"T00:00:00"); return d.toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'}); }
function dayName(dow){ return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][dow]; }
async function loadState(){
  try{
    const r = await storage.get('hearth-state', false);
    if(r && r.value){
      const parsed = JSON.parse(r.value);
      state.active = parsed.active || null;
      state.choreLog = parsed.choreLog || {};
      state.activityLog = parsed.activityLog || {};
      state.shiftLog = parsed.shiftLog || {};
    }
  }catch(e){ /* no saved state yet, defaults stand */ }
}

async function persist(){
  const payload = { active: state.active, choreLog: state.choreLog, activityLog: state.activityLog, shiftLog: state.shiftLog };
  try{
    const result = await storage.set('hearth-state', JSON.stringify(payload), false);
    if(!result){ saveError = "Save didn't go through — your change is kept on this screen, but try again so it sticks."; }
    else{ saveError = null; }
  }catch(e){
    saveError = "Save failed (connection hiccup) — your change is kept on this screen for now. Tap Retry save.";
  }
  return !saveError;
}

// Returns the 4 batch-prep dates, always Saturdays (so the 5½-6 hour session fits the weekend
// schedule instead of landing on a random workday), every 2 weeks from the first Saturday on/after
// the start date — if you start on a Saturday, that day itself is the first batch day.
function getBatchDates(startDateStr){
  const start = new Date(startDateStr+"T00:00:00");
  const daysUntilSaturday = (6 - start.getDay() + 7) % 7;
  const firstSaturday = new Date(start);
  firstSaturday.setDate(start.getDate() + daysUntilSaturday);
  const dates = [];
  for(let i=0;i<BATCHES_PER_CYCLE;i++){
    const d = new Date(firstSaturday);
    d.setDate(firstSaturday.getDate() + i*BATCH_EVERY_DAYS);
    dates.push(d);
  }
  return dates;
}

function cycleInfo(){
  if(!state.active) return null;
  const start = new Date(state.active.startDate+"T00:00:00");
  const today = new Date(); today.setHours(0,0,0,0);
  const batchDates = getBatchDates(state.active.startDate);
  const cycleEnd = new Date(start); cycleEnd.setDate(cycleEnd.getDate() + CYCLE_DAYS);
  const dayNum = Math.floor((today-start)/86400000)+1;
  const totalDays = Math.round((cycleEnd-start)/86400000);
  const daysLeft = Math.round((cycleEnd-today)/86400000);
  const weekNum = Math.max(1, Math.ceil(dayNum/7));
  const totalWeeks = Math.ceil(CYCLE_DAYS/7); // rough visual progress only — the real boundary is CYCLE_DAYS
  // Which batch index (0-1) is the most recent one on/before today? -1 = before the very first batch day.
  let batchIndex = -1;
  for(let i=0;i<batchDates.length;i++){ if(today >= batchDates[i]) batchIndex = i; else break; }
  const isBatchDay = batchDates.some(d => toLocalISO(d)===toLocalISO(today));
  const nextBatchDate = batchDates.find(d => d > today) || null;
  return {dayNum, totalDays, daysLeft, weekNum, totalWeeks, batchIndex, isBatchDay, batchDates, nextBatchDate};
}

function nextPayday(){

  return PAYDAYS.find(p=>p>=t) || null;

/* ---- TODAY ---- */
function getShiftDay(dateKey){
  const d = state.shiftLog[dateKey];
  if(d && typeof d === 'object' && !Array.isArray(d)) return { hours:[false,false,false,false,false,false,false,false], break1:false, break2:false, lunch:false, deskTidy:false, status:null, ...d };
  // migrate old array-only format if it exists
  return { hours: Array.isArray(d) ? d : [false,false,false,false,false,false,false,false], break1:false, break2:false, lunch:false, deskTidy:false, status:null };
}

function computeStreak(){
  let streak = 0;
  let d = new Date();
  for(let i=0; i<60; i++){
    const dow = d.getDay();
    if(dow===0 || dow===6){ d.setDate(d.getDate()-1); continue; } // weekends never count, never break the streak
    const key = toLocalISO(d);
    const day = getShiftDay(key);
    const isToday = (i===0); // first iteration is always today, by construction — no string-matching needed
    if(isToday && !day.status){ d.setDate(d.getDate()-1); continue; } // today, nothing pressed yet — doesn't count and doesn't break anything
    if(day.status==='finished'){ streak++; d.setDate(d.getDate()-1); } // counts once you press Finished
    else if(day.status==='excused'){ d.setDate(d.getDate()-1); } // preserves the streak, doesn't add to it
    else{ break; } // Missed, or a past day you never submitted — streak stops here
  }
  return streak;
}

function renderStreakDisplay(streak, todayStatus){
  // Font size grows with the streak so it visibly gets bigger the longer you go without missing a day.
  // Starts around 2rem, grows steadily, caps out at 4rem so it never breaks the layout.
  const size = Math.min(2 + streak*0.12, 4).toFixed(2);
  const glow = streak>=10 ? 'text-shadow:0 0 18px rgba(224,162,74,0.55);' : (streak>=5 ? 'text-shadow:0 0 10px rgba(224,162,74,0.35);' : '');
  // Disambiguate: does this number include today, or is it carried over from your last completed workday?
  let subtitle = `day${streak===1?'':'s'} in a row`;
  if(todayStatus === 'finished'){
    subtitle += ' · includes today';
  } else if(!todayStatus){
    subtitle += streak>0 ? ' · today not counted yet' : '';
  }
  return `<div style="text-align:center;padding:10px 0 4px;">
    <div style="font-family:var(--font-display);font-weight:700;font-size:${size}rem;line-height:1;color:var(--amber);${glow}">🔥 ${streak}</div>
    <div style="font-size:0.78rem;color:var(--ink-soft);margin-top:4px;">${subtitle}</div>
  </div>`;
}

function fmtHMS(ms){ const t=Math.max(0,Math.floor(ms/1000)); const p=n=>String(n).padStart(2,'0'); return p(Math.floor(t/3600))+':'+p(Math.floor((t%3600)/60))+':'+p(t%60); }
function tickShift(){ const el=document.getElementById('shiftClock'); if(!el) return; const rem=(+el.dataset.start)+8*3600000-Date.now(); el.textContent = rem>0 ? 'T-MINUS '+fmtHMS(rem)+' REMAINING' : 'SHIFT WINDOW COMPLETE — STAND DOWN WHEN READY'; }

  const chore=(typeof CHORES!=='undefined'&&CHORES.find(c=>c.dow===dow))||null;

/* ---- STATS ---- */
function renderStats(){
  const allDays = Object.keys(state.shiftLog);

  // Walk every weekday from the first day you ever logged anything through yesterday.
  // A weekday with no entry at all counts the same as an explicit "Missed" tap —
  // skipping the app doesn't skip the tally. Today is handled separately below since
  // it may still be in progress and shouldn't be counted as missed just because it's not done yet.
  let finished = 0, missed = 0, excused = 0;
  let longest = 0, running = 0;
  if(allDays.length){
    const earliest = allDays.slice().sort()[0];
    let d = new Date(earliest+"T00:00:00");
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate()-1);
    yesterday.setHours(0,0,0,0);
    while(d <= yesterday){
      const dow = d.getDay();
      if(dow===0 || dow===6){ d.setDate(d.getDate()+1); continue; } // weekends never count
      const key = toLocalISO(d);
      const day = getShiftDay(key);
      if(day.status==='finished'){ finished++; running++; longest = Math.max(longest, running); }
      else if(day.status==='excused'){ excused++; /* preserves the run, doesn't add to it */ }
      else{ missed++; running = 0; } // explicit "missed" OR never logged at all — both count as missed
      d.setDate(d.getDate()+1);
    }
    const today = getShiftDay(todayISO());
    const todow = new Date().getDay();
    if(todow>=1 && todow<=5){
      if(today.status==='finished'){ finished++; running++; longest = Math.max(longest, running); }
      else if(today.status==='excused'){ excused++; }
      else if(today.status==='missed'){ missed++; running = 0; }
      // no status yet today: not counted either way — still in progress, matches the streak logic on Today
    }
  }
  const totalSubmitted = finished + missed + excused;
  const goodPct = totalSubmitted>0 ? Math.round((finished/totalSubmitted)*100) : 0;
  const currentStreak = computeStreak();
  const todayIsFinished = getShiftDay(todayISO()).status === 'finished';

  const choreCount = Object.values(state.choreLog).filter(v=>v).length;
  const activityDays = Object.keys(state.activityLog).length;

  return `
    <h1 class="page-title">Ship Stats</h1>
    <p class="page-sub">Simple, honest numbers — no pressure, just what actually happened.</p>

    <div class="grid-2">
      <div class="card" style="text-align:center;">
        <div class="eyebrow">Current streak</div>
        <div style="font-family:var(--font-display);font-weight:700;font-size:2.6rem;color:var(--amber);">🔥 ${currentStreak}</div>
        <p style="font-size:0.85rem;color:var(--ink-soft);margin:4px 0 0;">day${currentStreak===1?'':'s'} in a row${(!todayIsFinished && currentStreak>0) ? ' · today not counted yet' : (todayIsFinished ? ' · includes today' : '')}</p>
      </div>
      <div class="card" style="text-align:center;">
        <div class="eyebrow">Longest streak ever</div>
        <div style="font-family:var(--font-display);font-weight:700;font-size:2.6rem;color:var(--amber);">🏆 ${longest}</div>
        <p style="font-size:0.85rem;color:var(--ink-soft);margin:4px 0 0;">day${longest===1?'':'s'}, your best run so far</p>
      </div>
    </div>

    <div class="card">
      <h3>Days done good vs. days done bad</h3>
      <table class="grocery">
        <tr><th>Status</th><th>Count</th></tr>
        <tr><td>✅ Finished</td><td>${finished}</td></tr>
        <tr><td>📋 Excused</td><td>${excused}</td></tr>
        <tr><td>❌ Missed</td><td>${missed}</td></tr>
        <tr><td>Finish rate</td><td>${goodPct}%</td></tr>
      </table>
      <p style="font-size:0.85rem;color:var(--ink-soft);margin-top:10px;">${totalSubmitted===0?"No shifts logged yet — mark your first one on the Today tab.":"Based on "+totalSubmitted+" work day"+(totalSubmitted===1?'':'s')+" since you started tracking — a day you never logged counts as missed, same as tapping Missed."}</p>
    </div>

    <div class="card">
      <h3>Everything else, all-time</h3>
      <ul class="plain">
        <li><b>${choreCount}</b> chores marked done from the Calendar</li>
        <li><b>${activityDays}</b> day${activityDays===1?'':'s'} with a chore/workout/meal logged from the Calendar day view</li>
      </ul>
    </div>

    <div class="card">
      <h3>Backup & restore</h3>
      <p style="font-size:0.9rem;color:var(--ink-soft);">If you're opening this app as a downloaded file (not through Claude directly), your data lives in this phone's browser storage — which isn't always permanent. Copy a backup here now and then, and paste it back in if anything ever gets cleared.</p>
      <div class="field-row" style="margin-bottom:6px;">
        <button class="btn ghost small" id="exportBackupBtn">Show backup text</button>
      </div>
      <div id="backupOutputWrap" style="display:none;">
        <textarea id="backupOutput" readonly style="width:100%;min-height:90px;background:#1a1209;color:var(--ink-soft);border:1px solid var(--line);border-radius:6px;padding:10px;font-family:var(--font-mono);font-size:0.72rem;"></textarea>
        <p style="font-size:0.8rem;color:var(--ink-soft);margin:6px 0 0;">Tap the box, select all, copy — then paste it somewhere safe (like a Notes app).</p>
      </div>
      <div class="field-row" style="margin-top:14px;">
        <div class="field" style="flex:1;min-width:100%;">
          <label>Paste a backup to restore</label>
          <textarea id="backupInput" placeholder="Paste your saved backup text here" style="width:100%;min-height:70px;background:#241a11;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px;font-family:var(--font-mono);font-size:0.72rem;"></textarea>
        </div>
      </div>
      <button class="btn small" id="restoreBackupBtn" style="margin-top:8px;">Restore from pasted backup</button>
    </div>

    <div class="card">
      <h3>Reset workday tracker</h3>
      <p style="font-size:0.9rem;color:var(--ink-soft);">Clears every Finished/Missed/Excused entry and hourly check-in ever logged — the streak (current and longest) goes back to 0. Nothing else (plans, chores, paydays) is touched.</p>
      <button class="btn ghost small" id="resetShiftDataBtn">Reset all workday tracker data</button>
    </div>
  `;
}

function renderCalendar(){
  const now = new Date();
  const viewDate = new Date(now.getFullYear(), now.getMonth()+calMonthOffset, 1);
  const year = viewDate.getFullYear(), month = viewDate.getMonth();
  const monthName = viewDate.toLocaleDateString('en-CA',{month:'long', year:'numeric'});
  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayStr = todayISO();

  let doneCount = Object.values(state.choreLog).filter(v=>v).length;

  let cells = '';
  for(let i=0;i<firstDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateObj = new Date(year, month, d);
    const iso = toLocalISO(dateObj);
    const dow = dateObj.getDay();
    const chore = CHORES.find(c=>c.dow===dow);
    const isToday = iso===todayStr;
    const isPayday = PAYDAYS.includes(iso);
    let isBatchDay = false, planDayLabel = '';
    if(state.active){
      const start = new Date(state.active.startDate+"T00:00:00");
      const dNum = Math.floor((dateObj-start)/86400000)+1;
      const batchDates = getBatchDates(state.active.startDate);
      isBatchDay = batchDates.some(bd => toLocalISO(bd)===iso);
      if(dNum>=1) planDayLabel = `Day ${dNum}`;
    }
    const done = !!state.choreLog[iso];
    const isSelected = selectedCalDate===iso;
    const dowShort = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][dow];
    const cellLabel = isBatchDay ? `🌯 Batch day` : chore.task.split(' — ')[0].split(',')[0];

    cells += `<div class="cal-cell ${isToday?'today':''} ${isSelected?'selected':''}" data-daycell="${iso}">
      <div class="cal-cell-top">
        <div class="cal-daynum" data-expand="${iso}" style="cursor:pointer;">${dowShort} ${d}</div>
        <div class="cal-icons">${isPayday?'<span title="Payday">💳</span>':''}${isBatchDay?'<span title="Batch day">🌯</span>':''}</div>
      </div>
      <div class="cal-chore" data-expand="${iso}" style="cursor:pointer;">${cellLabel}${planDayLabel?` · ${planDayLabel}`:''}</div>
      <button class="cal-toggle ${done?'done':''}" data-date="${iso}">${done?'✓ Done':'Mark done'}</button>
      ${isSelected ? renderDayDetailContent(iso, dow) : ''}
    </div>`;
  }

  return `
    <h1 class="page-title">Mission Log</h1>
    <p class="page-sub">Chores, batch days, and paydays in one view. Tap a day number to see everything for that day and check things off one at a time.</p>
    <div class="card">
      <div class="cal-head">
        <button class="btn ghost small" id="calPrev">← Prev</button>
        <h3>${monthName}</h3>
        <button class="btn ghost small" id="calNext">Next →</button>
      </div>
      <div class="cal-grid">
        ${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells}
      </div>
      <div class="legend"><span>💳 payday</span><span>🌯 batch day</span><span>${doneCount} chores logged done, all-time</span></div>
    </div>
  `;
}

    ${CHORES.map(c=>`<tr class="${c.dow===dow?'today':''}"><td>${c.day}${c.dow===dow?' (today)':''}</td><td><b>${c.task}</b>${c.details.length?`<ul class="plain">${c.details.map(d=>`<li>${d}</li>`).join('')}</ul>`:''}</td></tr>`).join('')}
  </table></div>`;

  html += Object.keys(WORKOUTS).map(k=>`<div class="card"><h3>${k}</h3>${WORKOUTS[k].map(ex=>`
    <div class="recipe-block">
      <h4>${ex.name} <span class="tag">${ex.meta}</span></h4>
      <p style="margin:4px 0;font-size:0.9rem;"><b>How to do it:</b> ${ex.how}</p>
      <p style="margin:0;font-size:0.85rem;color:var(--ink-soft);"><b>Purpose:</b> ${ex.purpose}</p>
    </div>`).join('')}</div>`).join('');

  return html;
}

/* ---- PAYDAYS ---- */
function renderPaydays(){
  const np = nextPayday();
  const t = todayISO();
  let html = `<h1 class="page-title">Credits &amp; Fuel Reserves</h1><p class="page-sub">2026 payday calendar — every second Thursday. Useful for timing your next grocery restock.</p>`;
  html += `<div class="payday-grid">${PAYDAYS.map(p=>`<div class="payday-pill ${p===np?'next':(p<t?'past':'')}">${fmtDate(p)}${p===np?' · next':''}</div>`).join('')}</div>`;
  if(np){
    html += `<div class="banner info" style="margin-top:20px;"><span>💳</span><div><b>Next payday: ${fmtDate(np)}</b>If your current cycle is ending soon, this is a solid day to place the next grocery order.</div></div>`;
  }
  return html;
}

/* ============================= EVENTS ============================= */
function wireTabEvents(){
  document.querySelectorAll('[data-goto]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const goingToCalendar = el.dataset.goto === 'calendar';
      state.tab = el.dataset.goto;
      if(goingToCalendar){
        calMonthOffset = 0;
        selectedCalDate = null;
        scrollToTodayFlag = true;
      }
      render();
    });
  });
  document.querySelectorAll('.start-plan').forEach(el=>{
    el.addEventListener('click', ()=>{ openPlanId='__start__'; renderTab();
      setTimeout(()=>{ const sp = document.getElementById('startPanel'); if(sp && typeof sp.scrollIntoView === 'function'){ sp.scrollIntoView({behavior:'smooth', block:'center'}); } }, 50);
    });
  });
  const confirmBtn = document.getElementById('confirmStartBtn');
  if(confirmBtn){
    confirmBtn.addEventListener('click', async ()=>{
      try{
        confirmBtn.disabled = true; confirmBtn.textContent = 'Starting…';
        state.active = { startDate: todayISO() };
        await persist();
        openPlanId = null; state.tab='today'; render();
      }catch(e){
        saveError = 'Starting the cycle hit a snag: ' + e.message + ' — nothing was lost, just try tapping the button again.';
        confirmBtn.disabled = false; confirmBtn.textContent = 'Confirm & start today';
        renderTab();
      }
    });
  }
  const cancelBtn = document.getElementById('cancelStartBtn');
  if(cancelBtn){ cancelBtn.addEventListener('click', ()=>{ openPlanId=null; renderTab(); }); }

  const retryBtn = document.getElementById('retrySaveBtn');
  if(retryBtn){
    retryBtn.addEventListener('click', async ()=>{ await persist(); renderTab(); });
  }
  const resetShiftBtn = document.getElementById('resetShiftDataBtn');
  if(resetShiftBtn){
    resetShiftBtn.addEventListener('click', async ()=>{
      const sure = window.confirm('Clear all Finished/Missed/Excused history and hourly check-ins? This resets your streak to 0 and can\'t be undone.');
      if(!sure) return;
      state.shiftLog = {};
      await persist();
      renderTab();
    });
  }
  const exportBtn = document.getElementById('exportBackupBtn');
  if(exportBtn){
    exportBtn.addEventListener('click', ()=>{
      const payload = { active: state.active, choreLog: state.choreLog, activityLog: state.activityLog, shiftLog: state.shiftLog };
      const text = JSON.stringify(payload);
      const wrap = document.getElementById('backupOutputWrap');
      const out = document.getElementById('backupOutput');
      if(wrap && out){
        wrap.style.display = 'block';
        out.value = text;
        out.focus();
        out.select();
        // Try the clipboard API too (works in most contexts, but not guaranteed on file:// pages) — the visible
        // selected textarea above is the reliable fallback either way, so this is just a nice-to-have.
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(text).catch(()=>{ /* fine, manual copy still works */ });
        }
      }
    });
  }
  const restoreBtn = document.getElementById('restoreBackupBtn');
  if(restoreBtn){
    restoreBtn.addEventListener('click', async ()=>{
      const input = document.getElementById('backupInput');
      const raw = input ? input.value.trim() : '';
      if(!raw){ saveError = 'Paste your backup text into the box first.'; renderTab(); return; }
      let parsed;
      try{ parsed = JSON.parse(raw); }
      catch(e){ saveError = 'That doesn\'t look like a valid backup — make sure you copied the whole thing.'; renderTab(); return; }
      const sure = window.confirm('Restore this backup? It will replace everything currently in the app (plan, chores, workouts, streak).');
      if(!sure) return;
      state.active = parsed.active || null;
      state.choreLog = parsed.choreLog || {};
      state.activityLog = parsed.activityLog || {};
      state.shiftLog = parsed.shiftLog || {};
      await persist();
      renderTab();
    });
  }
  const calPrev = document.getElementById('calPrev');
  if(calPrev){ calPrev.addEventListener('click', ()=>{ calMonthOffset--; renderTab(); }); }
  const calNext = document.getElementById('calNext');
  if(calNext){ calNext.addEventListener('click', ()=>{ calMonthOffset++; renderTab(); }); }
  document.querySelectorAll('.cal-toggle').forEach(el=>{
    el.addEventListener('click', async (ev)=>{
      ev.stopPropagation();
      const date = el.dataset.date;
      state.choreLog[date] = !state.choreLog[date];
      await persist();
      renderTab();
    });
  });
  document.querySelectorAll('[data-expand]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const d = el.dataset.expand;
      selectedCalDate = selectedCalDate===d ? null : d;
      renderTab();
    });
  });
  const closeDetail = document.getElementById('closeDayDetail');
  if(closeDetail){ closeDetail.addEventListener('click', ()=>{ selectedCalDate = null; renderTab(); }); }
  document.querySelectorAll('[data-activity]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const date = el.dataset.date;
      const key = el.dataset.activity;
      if(!state.activityLog[date]) state.activityLog[date] = {chore:false, workout:false, meal:false};
      state.activityLog[date][key] = !state.activityLog[date][key];
      await persist();
      renderTab();
    });
  });
  document.querySelectorAll('.shift-hour').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const dateKey = todayISO();
      if(!state.shiftLog[dateKey]) state.shiftLog[dateKey] = { hours:[false,false,false,false,false,false,false,false], break1:false, break2:false, lunch:false, deskTidy:false, status:null };
      const day = state.shiftLog[dateKey];
      if(el.dataset.hour !== undefined){
        const idx = parseInt(el.dataset.hour,10);
        day.hours[idx] = !day.hours[idx];
      } else if(el.dataset.break){
        const key = el.dataset.break;
        day[key] = !day[key];
      }
      await persist();
      renderTab();
    });
  });
  document.querySelectorAll('[data-clockin]').forEach(el=>{ el.addEventListener('click', async ()=>{ const d=ensureDay(todayISO()); d.clockIn=Date.now(); await persist(); renderTab(); }); });
  document.querySelectorAll('[data-standdown]').forEach(el=>{ el.addEventListener('click', async ()=>{ const d=ensureDay(todayISO()); d.status='finished'; d.clockOut=Date.now(); await persist(); showStandDown(); renderTab(); }); });
  document.querySelectorAll('[data-override]').forEach(el=>{ el.addEventListener('click', async ()=>{ const d=ensureDay(todayISO()); d.override=true; await persist(); renderTab(); }); });
  document.querySelectorAll('[data-status]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const dateKey = todayISO();
      if(!state.shiftLog[dateKey]) state.shiftLog[dateKey] = { hours:[false,false,false,false,false,false,false,false], break1:false, break2:false, lunch:false, deskTidy:false, status:null };
      const val = el.dataset.status;
      state.shiftLog[dateKey].status = val === '' ? null : val;
      await persist();
      renderTab();
    });
  });
}

/* ============================= GLOBAL SAFETY NET ============================= */
// If any click handler or async task throws an error we didn't anticipate,
// surface it visibly instead of the button silently doing nothing.
window.addEventListener('error', (e)=>{
  saveError = 'Something unexpected went wrong: ' + (e.message || 'unknown error') + '. Try the action again — nothing entered is lost.';
  try{ renderTab(); }catch(_){}
});
window.addEventListener('unhandledrejection', (e)=>{
  saveError = 'Something unexpected went wrong: ' + (e.reason && e.reason.message ? e.reason.message : 'unknown error') + '. Try the action again — nothing entered is lost.';
  try{ renderTab(); }catch(_){}
});

/* ============================= INIT ============================= */
(async function init(){
  await loadState();
  render();
})();
</script>
